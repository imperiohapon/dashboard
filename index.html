<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Portal Império</title>

<style>
body { margin:0; font-family: Arial; display:flex; }
.menu {
  width:220px;
  background:#1a1a2e;
  color:#fff;
  height:100vh;
  padding:15px;
}
.menu h2 { font-size:18px; margin-bottom:20px; }
.menu button {
  display:block;
  width:100%;
  margin:8px 0;
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#fff;
}
.menu button:hover { background:#4361ee; color:#fff; }

iframe {
  flex:1;
  border:none;
}
</style>
</head>

<body>

<div class="menu">
  <h2>📊 Império</h2>

  <button onclick="loadPage('performance.html')">Performance</button>
  <button onclick="loadPage('conversao.html')">Conversão</button>
  <button onclick="loadPage('qualidade.html')">Qualidade</button>

</div>

<iframe id="frame" src="performance.html"></iframe>

<script>
function loadPage(page){
  document.getElementById('frame').src = page;
}
</script>

</body>
</html>
